name: Deploy (target adapter required)

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Full, immutable commit SHA already merged into the default branch
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate immutable commit identifier
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          if [[ ! "$RELEASE_REF" =~ ^[0-9a-f]{40}$ ]]; then echo "release_ref must be a full 40-character commit SHA; branches and mutable tags are rejected."; exit 1; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          ref: ${{ inputs.release_ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify commit is on the default branch
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git merge-base --is-ancestor "$RELEASE_REF" "origin/$DEFAULT_BRANCH" || { echo "The commit must be reachable from the protected default branch ($DEFAULT_BRANCH)."; exit 1; }
      - name: Require reviewed target configuration
        env:
          TARGET: ${{ vars.DEPLOY_TARGET }}
          ADAPTER: ${{ vars.DEPLOY_ADAPTER }}
          ENABLED: ${{ vars.DEPLOYMENT_ENABLED }}
          DEPLOY_CREDENTIAL: ${{ secrets.DEPLOY_CREDENTIAL }}
        run: |
          if [ "$ENABLED" != "true" ]; then echo "Deployment disabled: configure protected production variable DEPLOYMENT_ENABLED=true only after selecting and reviewing a target."; exit 1; fi
          if [ -z "$TARGET" ] || [ -z "$ADAPTER" ]; then echo "Deployment configuration missing: set DEPLOY_TARGET and DEPLOY_ADAPTER in the protected production environment."; exit 1; fi
          if [ -z "$DEPLOY_CREDENTIAL" ]; then echo "Deployment credential missing: configure a narrowly scoped DEPLOY_CREDENTIAL secret in the protected production environment."; exit 1; fi
          if ! echo "$ADAPTER" | grep -Eq '^[a-zA-Z0-9_-]+\.sh$'; then echo "Invalid DEPLOY_ADAPTER. Use a reviewed shell script filename."; exit 1; fi
          if [ ! -x "scripts/deploy/$ADAPTER" ]; then echo "Deployment adapter scripts/deploy/$ADAPTER is absent. Add and review a target-specific adapter before enabling deployment."; exit 1; fi
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0, Node 24
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, dom, fileinfo, simplexml
          coverage: pcov
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, Node 24
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci
      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force
      - name: Run deployment quality gates
        run: |
          composer lint
          composer analyse
          composer audit --locked --no-interaction
          npm audit --audit-level=high
          npm run build
          php artisan test --coverage --min=80
      - name: Build immutable image artifact
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          docker build --target runtime --tag "portfolio-app:$RELEASE_REF" .
          docker build --target web --tag "portfolio-web:$RELEASE_REF" .
          docker save "portfolio-app:$RELEASE_REF" "portfolio-web:$RELEASE_REF" --output portfolio-images.tar
      - name: Execute reviewed deployment adapter
        env:
          ADAPTER: ${{ vars.DEPLOY_ADAPTER }}
          DEPLOY_CREDENTIAL: ${{ secrets.DEPLOY_CREDENTIAL }}
          RELEASE_REF: ${{ inputs.release_ref }}
          TARGET: ${{ vars.DEPLOY_TARGET }}
        run: |
          echo "Passing the validated PHP-FPM and Nginx image bundle plus release ref to the adapter. It must perform safe migrations, deployment, health verification, and release traceability."
          "scripts/deploy/$ADAPTER" portfolio-images.tar "$RELEASE_REF" "$TARGET"
