name: Deploy (target adapter required)

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Immutable tag or commit to deploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_ref }}
      - name: Require reviewed target configuration
        env:
          TARGET: ${{ vars.DEPLOY_TARGET }}
          ADAPTER: ${{ vars.DEPLOY_ADAPTER }}
          ENABLED: ${{ vars.DEPLOYMENT_ENABLED }}
          DEPLOY_CREDENTIAL: ${{ secrets.DEPLOY_CREDENTIAL }}
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          if [ "$ENABLED" != "true" ]; then echo "Deployment disabled: configure protected production variable DEPLOYMENT_ENABLED=true only after selecting and reviewing a target."; exit 1; fi
          if [ -z "$TARGET" ] || [ -z "$ADAPTER" ]; then echo "Deployment configuration missing: set DEPLOY_TARGET and DEPLOY_ADAPTER in the protected production environment."; exit 1; fi
          if [ -z "$DEPLOY_CREDENTIAL" ]; then echo "Deployment credential missing: configure a narrowly scoped DEPLOY_CREDENTIAL secret in the protected production environment."; exit 1; fi
          if ! echo "$ADAPTER" | grep -Eq '^[a-zA-Z0-9_-]+\.sh$'; then echo "Invalid DEPLOY_ADAPTER. Use a reviewed shell script filename."; exit 1; fi
          if [ ! -x "scripts/deploy/$ADAPTER" ]; then echo "Deployment adapter scripts/deploy/$ADAPTER is absent. Add and review a target-specific adapter before enabling deployment."; exit 1; fi
          IMAGE_TAG="$(git rev-parse --short=12 HEAD)"
          docker build --target runtime --tag "portfolio:$IMAGE_TAG" .
          docker save "portfolio:$IMAGE_TAG" --output portfolio-image.tar
          echo "Passing immutable image artifact, release ref, and selected target to the reviewed adapter. Adapter must perform safe migrations, deploy, health verification, and release traceability."
          "scripts/deploy/$ADAPTER" portfolio-image.tar "$RELEASE_REF" "$TARGET"
