name: Draft tagged release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing validated version tag (for example v1.0.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate-and-draft:
    if: startsWith(inputs.tag, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: shivammathur/setup-php@44454db4f0199b8b9685a5d763dc37cbf79108e1 # 2.36.0
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_sqlite, sqlite3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci
      - run: |
          cp .env.example .env
          php artisan key:generate
          composer lint
          composer analyse
          composer test
          npm run build
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release create "$RELEASE_TAG" --draft --verify-tag --generate-notes
