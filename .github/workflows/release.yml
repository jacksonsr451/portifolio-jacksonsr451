name: Draft tagged release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semver tag on the default branch (for example v1.0.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate-and-draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0, Node 24
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, dom, fileinfo, simplexml
          coverage: pcov
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, Node 24
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci
      - name: Build frontend assets required by Blade tests
        run: npm run build
      - name: Validate tag and prepare application
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then echo "Release tag must follow vMAJOR.MINOR.PATCH with optional prerelease/build metadata."; exit 1; fi
          if [ "$(git rev-parse "$RELEASE_TAG^{commit}")" != "$(git rev-parse HEAD)" ]; then echo "Checked-out commit does not match the release tag."; exit 1; fi
          git merge-base --is-ancestor "$RELEASE_TAG" "origin/$DEFAULT_BRANCH" || { echo "Release tag must point to a commit on the default branch ($DEFAULT_BRANCH)."; exit 1; }
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force
          composer lint
          composer analyse
          composer audit --locked --no-interaction
          php artisan test --coverage --min=80
          npm audit --audit-level=high
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release create "$RELEASE_TAG" --draft --verify-tag --generate-notes
