name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0, Node 24
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, pdo_sqlite, sqlite3, dom, fileinfo, simplexml
          coverage: pcov
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, Node 24
        with:
          node-version: '22'
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0, Node 24
        with:
          path: ${{ runner.temp }}/composer-cache
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - name: Install PHP dependencies
        env:
          COMPOSER_CACHE_DIR: ${{ runner.temp }}/composer-cache
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend assets required by Blade tests
        run: npm run build
      - name: Prepare Laravel test environment
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force
      - name: Pint
        run: composer lint
      - name: Larastan
        run: composer analyse
      - name: Pest
        run: php artisan test --coverage --min=80
